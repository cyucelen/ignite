version: 2

linters-settings:
  cyclop:
    max-complexity: 10
    skip-tests: true

  gocyclo:
    min-complexity: 10

  dupl:
    threshold: 100

  goconst:
    min-len: 3
    min-occurrences: 3

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style

  revive:
    rules:
      - name: exported
        severity: warning
        disabled: false
      - name: package-comments
        severity: warning
        disabled: false

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - cyclop
    - gocyclo
    - dupl
    - goconst
    - gocritic
    - revive
    - misspell
    - unconvert
    - unparam

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - goconst
        - cyclop
        - gocyclo
  max-issues-per-linter: 0
  max-same-issues: 0
